name: Scorecard

# OpenSSF Scorecard: an automated audit of this repository's supply-chain
# hygiene (token permissions, pinned dependencies, branch protection, security
# policy, and so on). Results go to the code-scanning dashboard and, with
# publish_results, to scorecard.dev so the README badge can show the score.

on:
  # Branch protection is one of the checks, so re-score when it changes.
  branch_protection_rule:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]

# Deliberate deviation from the upstream template, which sets `read-all` here.
# The only job below carries its own complete permissions map, so this
# top-level value is never what the job runs with — it only sets the default
# for jobs without a map. Keeping it at `contents: read` matches ci.yml and
# release.yml. Verified on the first run; if a later Scorecard version needs a
# further read scope, add it to the job map below and say so here.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A job-level map resets every unlisted scope to `none`, so contents and
    # actions are spelled out even though the upstream template comments them
    # out for public repositories.
    permissions:
      contents: read # checkout
      actions: read # Scorecard reads workflow runs
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results signs the result for the badge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to scorecard.dev. Public repositories only; the result is
          # signed with the job's OIDC token, which is what id-token is for.
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
