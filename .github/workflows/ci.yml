name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the checked-out tree.
permissions:
  contents: read

# Cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint Markdown, JSON, jq, TypeScript, YAML, shell and Python, and
  # spell-check. Reuses `make lint` so the lint definition lives in one place
  # (the Makefile). The three Node lint tools are installed once, from pins
  # kept on the install step below, with npm's own cache restored first —
  # previously each ran through its own `npx --yes`, which re-resolved and
  # re-downloaded all three on every run of every leg. `ESBUILD` is the one
  # override still needed: its Makefile default is a pinned `npx` invocation,
  # deliberately, so that a local `make lint` works with nothing installed.
  # The runners differ: ubuntu-latest ships shellcheck, jq, and yamllint,
  # while the macOS image ships only jq and Node. Ruff comes from pipx on both, pinned to the
  # version every kit installs (`uv tool install ruff@…` in kits/*/spec.yaml):
  # bump them together, since Ruff's default rules move between releases.
  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git operations after checkout, so don't leave the job token in
          # .git/config where a later third-party step could read it.
          persist-credentials: false

      - name: Install lint tools missing from the macOS runner
        if: runner.os == 'macOS'
        run: brew install shellcheck yamllint

      # Keyed on this file, which holds every pin the install step below uses.
      # Not keyed on the Makefile: CI overrides its ESBUILD pin, so a Makefile
      # edit would evict this cache for no reason. restore-keys means a pin
      # bump re-downloads only the delta instead of starting cold.
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install lint tools
        run: npm install --global markdownlint-cli2@0.23.3 cspell@10.3.3 esbuild@0.28.2

      - name: Install Ruff
        run: pipx install ruff==0.16.8

      - name: Lint (markdownlint, jq, esbuild, yamllint, shellcheck, ruff, cspell)
        run: make lint ESBUILD=esbuild

  # Test the wrapper's dispatch against a fake sbx CLI on PATH — no real
  # sandbox, no Docker, no network.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test wrapper
        run: make test-unit

      # macOS still ships bash 3.2 as /bin/bash, which is the oldest
      # interpreter the wrapper has to run under.
      - name: Test wrapper under bash 3.2
        if: runner.os == 'macOS'
        run: make test-unit BASH=/bin/bash

  # Build every kit for both Linux architectures and check each result with
  # kit-tck. sbx v0.54.0 cannot check a schema v3 source kit without its
  # daemon, so sbx is not involved: how the kits compose with Docker's agent
  # workloads is a host check (AGENTS.md). Linux only, because the macOS
  # runners have no Docker.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same version and digest the kits' recipes pin (docs/toolchain.md).
      - name: Install kit-tck
        env:
          KIT_TCK_VERSION: 3.0.0-m.12
          KIT_TCK_SHA256: 473b72d7bb48b11987250493e9b47fb2c616de601777e139191a86fc5e962f21
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/docker/sandbox-kit-spec/releases/download/v${KIT_TCK_VERSION}/kit-tck_${KIT_TCK_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/kit-tck.tar.gz
          actual_sha256="$(sha256sum /tmp/kit-tck.tar.gz | cut -d' ' -f1)"
          if [[ "${actual_sha256}" != "${KIT_TCK_SHA256}" ]]; then
            echo "kit-tck checksum mismatch: got ${actual_sha256}, want ${KIT_TCK_SHA256}" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.local/bin"
          tar xzf /tmp/kit-tck.tar.gz -C "${HOME}/.local/bin" kit-tck
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Build and check every kit
        run: make validate PLATFORMS=linux/amd64,linux/arm64
