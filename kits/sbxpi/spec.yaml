schemaVersion: "2"
kind: sandbox
name: sbxpi
version: "0.4.9"
displayName: Pi with custom toolchain
description: Pi with custom toolchain

# Host-side SBXAGENT_LITE, passed by scripts/sbxagent as --kit-arg lite=...
# and substituted into the install steps and instructions below before the
# spec is decoded.
args:
  lite:
    default: "true"
    enum: ["true", "false"]
    description: Skip Playwright, Chromium, mermaid-cli and XeTeX

sandbox:
  # No `extends:` — Pi has no parent kit (only claude, codex, copilot, cursor,
  # gemini, kiro, opencode are valid `extends:` values). Built on the bare
  # shell-docker template instead, so unlike the siblings there is no parent
  # setup to merge with and no token export to wrap. The entrypoint only
  # redirects Pi's session tree into the wrapper-managed state mount.
  image: "docker/sandbox-templates:shell-docker"
  entrypoint:
    - sh
    - -c
    - |
      set -eu
      # PI_CODING_AGENT_SESSION_DIR flattens Pi's native per-project layout
      # and changes continue-session lookup, so retain the stock path and
      # bind-mount the state folder over it instead.
      #
      # The bind mount does not survive a stop, so this runs on every boot, and
      # any failure is fatal: sessions written to an unbound stock path would
      # die with the sandbox rather than reach the state folder.
      mount_state_status=0
      sh "$HOME/.local/lib/sbxagent/mount-state.sh" "$HOME/.pi/agent/sessions" sessions ||
        mount_state_status=$?
      if [ "${mount_state_status}" -ne 0 ]; then
        echo "sbxpi: could not relocate ~/.pi/agent/sessions onto the state folder; refusing to start pi" >&2
        exit "${mount_state_status}"
      fi
      exec pi "$@"
    - sbxpi-entrypoint
# resources:
#   cpu: 8
#   memory: 24g

environment:
  variables:
    PI_TELEMETRY: "0"
    PI_SKIP_VERSION_CHECK: "1"
    SBXAGENT_LITE: "${{ kit.args.lite }}"

agentInstructions:
  filename: AGENTS.md
  content: |
    ## Sandbox environment
    You are in a Docker Sandbox microVM. The user's project is mounted as your
    workspace, so file edits modify the host working tree. `sudo` is
    passwordless, and a sandbox-local Docker daemon is available.

    Network egress is allowlisted by default; this sandbox may instead have
    been created with `NETWORK_ALLOWLIST=false`, which turns that allow list
    off. Either way, if a network request fails because its host is blocked,
    stop and report it — do not run `sbx policy` inside the
    sandbox, and do not work around a block by mirroring, vendoring, retrying
    against a different host, or dropping the step. An extension enforces this
    in two steps: the blocked command's output is replaced with the remedy that
    fits — `sbx policy allow` for a default-deny, `sbx policy rm` for a local
    deny (deny beats allow), or contact IT for organisation policy — and your
    next tool call is then refused and the run ends. Reporting the block is the
    only way forward, so do it first rather than spending the one call you have
    left on a workaround.

    The in-sandbox `sbx` supports only `sbx version`, `sbx kit validate`,
    `sbx kit inspect`, and `sbx kit pack`. All sandbox management commands,
    including `run`, `create`, `rm`, `exec`, `inspect`, and `policy`, require
    the host CLI and `sandboxd`; ask the user to run them on the host.

    ## Preinstalled tools
    Follow the project's own instructions and use its declared dependencies
    first. For general development tasks, these tools are already on `PATH`:

    - Search and data: `rg` (ripgrep), `fdfind` (fd — Ubuntu names it
      `fdfind`, not `fd`), `jq`
    - Shell: `shellcheck`; use `bash -n` for syntax checks
    - Python: `python3`, `ruff` for lint and format, `uv` for packages,
      PyYAML for YAML parsing (`import yaml`)
    - YAML: `yamllint`
    - Markdown and prose: `markdownlint-cli2`, `cspell`
    - Browser, diagrams and PDF, only when the sandbox was created with
      `SBXAGENT_LITE=false` (here it is `${{ kit.args.lite }}`): `playwright`
      with headless Chromium — load pages, screenshot them, read console
      output to verify UI changes — `mmdc` (mermaid-cli):
      `mmdc -i diagram.mmd -o diagram.png` — and `xelatex`, so
      `pandoc doc.md -o doc.pdf --pdf-engine=xelatex` works
    - Documents: `pandoc` — convert between document formats (e.g. Markdown,
      HTML, docx)
    - General: `git`, `gh`, `docker`, `curl`, `node`, `npm`, `tree`
    - Sandbox kits: `sbx`, with the restrictions above
    - Docs: Context7 is installed as a native Pi package, not an MCP server —
      it registers its own tools directly. There is no GitHub MCP server in
      this kit either; Pi has no MCP support at all, so use `git` and `gh`
      via bash for GitHub operations instead.

    Prefer `rg` over recursive `grep`, `ruff` over installing another Python
    linter or formatter, and `uv` over `pip`. Install project dependencies when
    needed, but do not install global replacements for tools already provided.

# No web-access toggle here: unlike sbxclaude/sbxcodex/sbxcursor, Pi has no
# built-in WebSearch/WebFetch tool to gate, so there is nothing for an
# ALLOW_WEB switch to flip. Do not add a no-op toggle just to match siblings.

# Outbound egress allowlist. Default-deny: every host the kit reaches must be
# listed. This is the union of every kits/sbxclaude/spec.yaml host (this kit
# has no parent to inherit them from) plus the OpenRouter model API.
permissions:
  network:
    allow:
      # Model API. Every upstream provider (DeepInfra included) sits behind
      # OpenRouter and is never contacted directly — routing per model is
      # pinned via models.json's openRouterRouting.
      - "openrouter.ai:443"
      # No entry for Ollama here, deliberately — it cannot be expressed in a
      # kit. models.json reaches the host's Ollama at host.docker.internal,
      # but the proxy resolves that back to the host's own loopback and
      # reports the resource as "localhost:11434". A kit allowlist rejects
      # that form outright ("failed to apply kit to sandbox" — allow patterns
      # are dotted domains), and "host.docker.internal:11434" applies cleanly
      # yet never matches, which is worse: it looks like it works.
      # So enabling Ollama is a host-side step, like the OpenRouter secret:
      #   sbx policy allow network --sandbox <sbxpi-sandbox> localhost:11434
      # See the Ollama section in README.md.
      # Pi service bootstrap, telemetry and version checks (both disabled
      # above, but the host is still contacted).
      - "pi.dev"
      # npm: pi-coding-agent, context7-pi, markdownlint-cli2, cspell.
      - "registry.npmjs.org:443"
      # uv tool install: ruff, yamllint (index + wheels).
      - "pypi.org:443"
      - "files.pythonhosted.org:443"
      # Go modules and, since 1.21, the toolchain go.mod asks for.
      - "proxy.golang.org:443"
      - "sum.golang.org:443"
      # Playwright downloads the Chromium browser binary from these CDN mirrors.
      - "cdn.playwright.dev:443"
      - "playwright.download.prss.microsoft.com:443"
      # The Context7 native Pi package calls its documentation API here.
      - "context7.com:443"
      # GitHub release downloads (sbx CLI), `gh`, and page assets Playwright
      # browses. This kit registers no GitHub MCP server, so `gh` over the
      # proxy is how Pi reaches issues and pull requests.
      - "api.github.com:443"
      - "github.com:443"
      - "github.githubassets.com:443"
      - "gist.github.com:443"
      - "gist.githubusercontent.com:443"
      - "release-assets.githubusercontent.com:443"
      # apt-get update refreshes every template source, so all of them must be
      # reachable: Ubuntu amd64 (archive/security), arm64 (ports), and
      # Docker's apt repo. The siblings get these from their parent kit;
      # sbxpi has no parent kit, so they are listed explicitly here.
      - "archive.ubuntu.com:80"
      - "security.ubuntu.com:80"
      - "ports.ubuntu.com:80"
      - "download.docker.com:443"

# Credentials declare WHAT the kit needs and how the proxy injects it — not
# where it lives on the host. proxyManaged: true sets OPENROUTER_API_KEY
# inside the container as a proxy-managed sentinel.
credentials:
  - service: openrouter
    apiKey:
      name: OPENROUTER_API_KEY
      proxyManaged: true
      inject:
        - domain: openrouter.ai
          header: Authorization
          format: "Bearer %s"

setup:
  install:
    - command: |
        set -eu
        # Bounded the same way as the curl installs below (--retry 3
        # --retry-delay 2 --max-time 600): retry a flaky mirror a few times,
        # and give up on a hung one instead of stalling the build forever.
        # Acquire::Retries defaults to 0, so without it a single dropped
        # connection fails the whole kit build. `timeout` caps each call, so
        # the sequence is finite even if a fetch never returns — a killed
        # apt-get fails the build, and the image is rebuilt from scratch, so
        # there is no half-configured dpkg state to repair. This kit has no
        # parent, so its update refreshes every template source and has the
        # most mirrors to trip over.
        apt_get() {
          timeout 600 apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            "$@"
        }
        apt_get update
        # fd-find is not part of the sibling toolchain: Pi's file-search tool
        # shells out to `fd`, and if it finds neither `fd` nor `fdfind` on PATH
        # it downloads the binary from GitHub releases at first launch —
        # resolving "latest" at runtime, with no version pin and no checksum,
        # unlike every other binary this kit installs. Ubuntu
        # ships the binary as `fdfind` (the name `fd` is taken), which Pi
        # accepts natively via its systemBinaryNames list, so no symlink is
        # needed. ripgrep covers Pi's other bundled tool the same way.
        #
        # python3-yaml gives scripts `import yaml` (PyYAML) without a
        # separate pip install. build-essential + python3-dev let `uv`/`pip`
        # build Python C extensions from source when no matching wheel exists.
        apt_get install -y \
          build-essential \
          ca-certificates \
          curl \
          fd-find \
          jq \
          pandoc \
          python3 \
          python3-dev \
          python3-yaml \
          ripgrep \
          shellcheck \
          tree
      description: CLI tools
    - command: |
        set -eu
        arch="$(dpkg --print-architecture)"
        # Digests of the v0.45.0 release assets.
        case "$arch" in
          amd64)
            expected_sha256="77f3c36e63a60a034fa53b5a9e49c20c52c350a91b380ebd96281460a5270341"
            ;;
          arm64)
            expected_sha256="cbaf3746cbf0ac84f899a03fc9a281d6b011c73b1ebb1155893f13f49203f140"
            ;;
          *)
            echo "unsupported architecture for sbx: $arch" >&2
            exit 1
            ;;
        esac
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL --retry 3 --retry-delay 2 --max-time 600 \
          "https://github.com/docker/sbx-releases/releases/download/v0.45.0/DockerSandboxes-linux-${arch}.tar.gz" \
          -o "$tmp/sbx.tar.gz"
        actual_sha256="$(sha256sum "$tmp/sbx.tar.gz" | cut -d' ' -f1)"
        if [ "$actual_sha256" != "$expected_sha256" ]; then
          echo "sbx tarball checksum mismatch: got ${actual_sha256}, want ${expected_sha256}" >&2
          exit 1
        fi
        tar xzf "$tmp/sbx.tar.gz" -C "$tmp" docker-sbx/sbx
        install -m 0755 "$tmp/docker-sbx/sbx" /usr/local/bin/sbx
        sbx version
      description: sbx CLI for offline kit commands
    - command: |
        set -eu
        install -d -m 0755 /usr/local/lib/sbxagent

        # Guard filter. Reads a tool-result payload on stdin and writes a
        # verdict on stdout. Root-owned and outside $HOME so the agent does
        # not disable its own escalation with an ordinary file edit.
        # Kept in sync with kits/network-block.jq — make lint checks this.
        cat > /usr/local/lib/sbxagent/network-block.jq <<'JQFILTER'
        # Every string in the payload except the tool's own input. Field names
        # differ per event (.tool_response on PostToolUse, .error on
        # PostToolUseFailure), so match the whole payload rather than a field.
        def haystack: [ del(.tool_input) | .. | strings ] | join("\n");

        # Commands that can reach the network. Used to disqualify the
        # self-reference exemption below, so a real block is never masked.
        # Local git readers stay eligible; only git's network subcommands count.
        def reaches_network:
          (.tool_input.command // "")
          | test("https?://"
               + "|\\b(curl|wget|nc|telnet|ssh|scp|rsync)\\b"
               + "|\\b(npm|npx|pnpm|yarn|pip|pip3|uv|uvx)\\b"
               + "|\\b(apt|apt-get|brew|gh)\\b"
               + "|\\bdocker\\s+(pull|push|run|build)\\b"
               + "|\\bgit\\s+(fetch|pull|push|clone|remote|ls-remote|submodule)\\b");

        # These block strings appear verbatim in this project's own docs, spec,
        # and tests, so a Bash read of one of those files must not trip the
        # guard. Scoped to Bash's own command field so a blocked WebFetch URL
        # that merely contains one of these filenames is never exempted.
        #
        # The command must also show no sign of network egress. Without that,
        # `curl https://blocked # spec.yaml` would suppress a genuine block
        # behind a filename mention — the exact outcome this guard exists to
        # prevent. When a command both reads such a file and reaches out, fail
        # safe and let the guard fire.
        def self_reference:
          .tool_name == "Bash"
          and (reaches_network | not)
          and ((.tool_input.command // "")
               | test("AGENTS\\.md|CLAUDE\\.md|spec\\.yaml|network-block|toolchain_test"));

        # A WebFetch that came back HTTP 403 is a block on its face, whatever its
        # body happens to look like, so it drops the line anchor below. Wrapped in an
        # array so a non-object tool_response yields false rather than nothing — an
        # empty result would make the whole pipeline emit nothing and fail open.
        def http_403: [ .tool_response? | objects | .code? ] | any(. == 403);

        def stop($why; $tell):
          { continue: false,
            stopReason:
              ($why + " Stopping — do not retry, mirror, vendor, or otherwise work "
              + "around this. Report it to the user and wait."),
            systemMessage: $tell };

        # `capture` yields nothing on miss; without `// null` the pipeline would
        # emit no output at all (fail open). Bind hosts up front so each branch
        # below can use them — jq does not keep `as` bindings from an `if` condition.
        haystack as $out
        # A real block message starts its own line. The same words quoted inside prose
        # or markdown — release notes, our own docs, a grep hit — sit mid-line and must
        # not fire; that false positive stopped two real turns. jq's `^` means start of
        # string, not start of line, and the "m" flag does not change that (it only
        # makes `.` match newlines), so match an explicit line break instead.
        | (if .tool_name == "WebFetch" and http_403 then "" else "(^|\\n)[ \\t]*" end) as $anchor
        | (($out | capture($anchor + "Blocked by local rule for (?<h>[^\\s]+)").h) // null) as $denied
        | (($out | capture($anchor + "Blocked by network policy: domain (?<h>[^\\s]+)").h) // null) as $host
        | if self_reference then
            {}
          # Org policy: user cannot lift this; do not suggest `sbx policy allow`.
          elif $out | test($anchor + "Blocked by org policy") then
            stop("A network request was blocked by your organisation's policy.";
                 "Blocked by org policy.\n"
                 + "Your company policy is blocking this request — contact IT if you need access.")
          # Local deny: deny beats allow, so the rule must be removed.
          elif $denied != null then
            stop("A local deny rule blocks \($denied); `sbx policy allow` cannot override it.";
                 "Blocked host: \($denied) — by a local deny rule.\n"
                 + "Deny beats allow, so allowing it will not help. Find and remove the rule:\n"
                 + "  sbx policy ls --wide\n"
                 + "  sbx policy rm network --resource \"\($denied)\"                      # global\n"
                 + "  sbx policy rm network --sandbox <sandbox> --resource \"\($denied)\"  # one sandbox")
          # Default-deny: allow the host on the host machine.
          elif $host != null then
            stop("The sandbox network policy blocked \($host).";
                 "Blocked host: \($host)\n"
                 + "Run on your host:  sbx policy allow network \"\($host)\"")
          # Block string present but host not parseable.
          elif $out | test($anchor + "Blocked by (network policy|local rule for)") then
            stop("A network request was blocked by the sandbox network policy.";
                 "A network request was blocked by the sandbox network policy.\n"
                 + "See the tool output above for the host, then allow it with:\n"
                 + "  sbx policy allow network \"<host>\"")
          else
            {}
          end
        JQFILTER

        # The Pi half of the guard. sbxclaude registers the filter as an
        # admin-tier Claude Code hook; Pi has no managed-settings tier, so
        # this extension is registered from ~/.pi/agent/settings.json
        # instead — a weaker binding, documented in the README.
        cat > /usr/local/lib/sbxagent/network-block.ts <<'EXTENSION'
        /**
         * Network-block escalation guard.
         *
         * Pi has no managed-settings tier the way Claude Code does, so this file is
         * root-owned and lives outside $HOME: the agent it watches cannot disable it
         * with an ordinary file edit. The policy itself is not restated here — the
         * verdict comes from network-block.jq, the same filter sbxclaude and
         * sbxcodex run, so there is exactly one place to change what counts as a
         * block and `make lint` keeps every copy of it in sync.
         *
         * Two phases, because a tool_result handler cannot end a run: it may only
         * patch content, details, isError and usage.
         *   1. tool_result — replace the blocked tool's output with the remedy.
         *   2. tool_call   — refuse every later call and terminate the run.
         * The net effect matches sbxclaude's hard stop, one beat later.
         */
        import type { ExtensionAPI } from "@earendil-works/pi-coding-agent";
        import { spawnSync } from "node:child_process";

        const FILTER = "/usr/local/lib/sbxagent/network-block.jq";

        // Every stop path in the filter requires this literal, so it is a safe
        // necessary condition — used only to avoid spawning jq on output that cannot
        // be a block. Deliberately broader than the policy; jq still decides.
        const MAYBE_BLOCKED = "Blocked by ";

        function textOf(content: unknown): string {
          if (!Array.isArray(content)) return "";
          return content
            .map((block: any) =>
              block && typeof block.text === "string" ? block.text : "")
            .join("\n");
        }

        /** The filter's verdict for one tool result, or null to allow it through. */
        function verdict(event: any): string | null {
          // Only bash reaches the network, which mirrors the "Bash|WebFetch" hook
          // matcher on sbxclaude. The scoping is load-bearing: the filter exempts a
          // *Bash* read of this repo's own docs, so routing Pi's `read` tool through
          // it would turn an ordinary read of AGENTS.md into a false block.
          if (event?.toolName !== "bash") return null;

          const response = {
            output: textOf(event.content),
            details: event.details ?? null,
            isError: event.isError === true,
          };

          let haystack: string;
          try {
            haystack = JSON.stringify(response);
          } catch {
            return null;
          }
          if (!haystack.includes(MAYBE_BLOCKED)) return null;

          // tool_name and tool_input are the field names network-block.jq already
          // expects. "Bash" carries a capital B to match its self-reference
          // exemption, which is scoped to that exact tool name.
          const payload = JSON.stringify({
            tool_name: "Bash",
            tool_input: { command: String(event?.input?.command ?? "") },
            tool_response: response,
          });

          const jq = spawnSync("jq", ["-f", FILTER], {
            input: payload,
            encoding: "utf8",
            timeout: 5000,
          });
          // Fail open if the toolchain is broken. A guard that blocked every command
          // whenever jq went missing would do more damage than the escape it stops.
          if (jq.status !== 0 || !jq.stdout) return null;

          let parsed: any;
          try {
            parsed = JSON.parse(jq.stdout);
          } catch {
            return null;
          }
          if (!parsed || parsed.continue !== false) return null;

          // stopReason instructs the model, systemMessage carries the remedy. Pi has
          // one channel here, so the model gets both.
          return [parsed.stopReason, parsed.systemMessage]
            .filter(Boolean)
            .join("\n\n");
        }

        export default function (pi: ExtensionAPI) {
          let blocked: string | null = null;

          // Reset per agent run, not per turn. `turn_start` fires again for every
          // LLM response *within* one user prompt, so clearing there would release
          // the exact follow-up call this guard exists to stop. Never clearing would
          // strand the session, still blocked after the user has fixed the policy.
          pi.on("agent_start", () => {
            blocked = null;
          });

          pi.on("tool_result", (event: any) => {
            if (blocked) return;
            const stop = verdict(event);
            if (!stop) return;
            blocked = stop;
            return { content: [{ type: "text", text: stop }], isError: true };
          });

          pi.on("tool_call", () => {
            if (!blocked) return;
            return { block: true, reason: blocked, terminate: true };
          });
        }
        EXTENSION

        chmod 0644 /usr/local/lib/sbxagent/network-block.jq \
          /usr/local/lib/sbxagent/network-block.ts

        # Fail the build rather than ship a guard that silently does nothing.
        jq -n '{tool_name:"Bash",tool_input:{command:"curl https://probe.test"},error:"Blocked by local rule for probe.test"}' \
          | jq -e -f /usr/local/lib/sbxagent/network-block.jq >/dev/null
        grep -q "network-block\.jq" /usr/local/lib/sbxagent/network-block.ts
        grep -q "export default function" /usr/local/lib/sbxagent/network-block.ts
      description: Network-block escalation guard
    - command: "uv tool install ruff@0.16.8"
      user: "1000"
      description: Ruff
    - command: "uv tool install yamllint@1.38.0"
      user: "1000"
      description: yamllint
    - command: |
        set -eu
        # npm through the sandbox proxy is flaky on this image. `npm config`
        # writes ~/.npmrc, so every npm step below inherits these — which is
        # why this runs before the first of them, as the same user (1000)
        # that owns that ~/.npmrc.
        npm config set proxy "$HTTP_PROXY"
        npm config set https-proxy "$HTTP_PROXY"
      user: "1000"
      description: Point npm at the sandbox proxy
    - command: "npm install --global markdownlint-cli2@0.23.3 cspell@10.3.3"
      user: "1000"
      description: Markdown and spelling linters
    - command: |
        set -eu
        [ "${{ kit.args.lite }}" = "false" ] || exit 0
        # Same retry and timeout bounds as the CLI tools step above, with a
        # longer cap because TeX Live is a few hundred MB.
        # --no-install-recommends skips the documentation packages, which
        # would roughly double that.
        timeout 1200 apt-get \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=30 \
          -o Acquire::https::Timeout=30 \
          install -y --no-install-recommends \
          texlive-xetex \
          texlive-fonts-recommended \
          texlive-latex-extra \
          lmodern
      description: XeTeX for pandoc PDF output (SBXAGENT_LITE=false only)
    - command: |
        set -eu
        [ "${{ kit.args.lite }}" = "false" ] || exit 0
        npm install --global playwright@1.63.0
        playwright install --with-deps chromium
      user: "1000"
      description: Playwright with headless Chromium (SBXAGENT_LITE=false only)
    - command: |
        set -eu
        [ "${{ kit.args.lite }}" = "false" ] || exit 0
        # PUPPETEER_SKIP_DOWNLOAD avoids fetching a second Chromium: mmdc
        # reuses the one Playwright just installed, above.
        PUPPETEER_SKIP_DOWNLOAD=1 npm install --global @mermaid-js/mermaid-cli@11.17.0
        chromium_path="$(NODE_PATH="$(npm root -g)" node -e \
          'console.log(require("playwright").chromium.executablePath())')"
        mmdc_bin="$(command -v mmdc)"
        config="$(dirname "$mmdc_bin")/mermaid-puppeteer-config.json"
        printf '{"executablePath": "%s"}\n' "$chromium_path" > "$config"
        # mmdc only takes its Puppeteer config via an explicit flag, so wrap
        # the real binary to always pass it — keeps `mmdc -i a.mmd -o a.png`
        # working with no extra flags for the agent.
        mv "$mmdc_bin" "${mmdc_bin}.real"
        cat > "$mmdc_bin" <<WRAPPER
        #!/bin/sh
        exec "${mmdc_bin}.real" --puppeteerConfigFile "${config}" "\$@"
        WRAPPER
        chmod +x "$mmdc_bin"
      user: "1000"
      description: mermaid-cli, reusing the Playwright Chromium (SBXAGENT_LITE=false only)
    - command: |
        set -eu
        PI_VERSION=0.84.4

        # Pi is the one install worth retrying: it is the agent itself, so a
        # transient proxy failure here leaves an unusable sandbox. One socket,
        # 10-minute fetch, five attempts.
        npm_install_retry() {
          pkg=$1
          attempt=1
          until npm install -g --ignore-scripts --maxsockets=1 \
            --fetch-timeout=600000 "$pkg"
          do
            if [ "$attempt" -ge 5 ]; then
              echo "${pkg} install failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "${pkg} install failed (attempt ${attempt}/5), retrying..."
            attempt=$((attempt + 1))
            sleep 5
          done
        }

        # Note the scope: @earendil-works, not the frozen, security-patch-less
        # legacy @mariozechner/pi-coding-agent.
        npm_install_retry "@earendil-works/pi-coding-agent@${PI_VERSION}"
      user: "1000"
      description: Pi coding agent
    - command: |
        set -eu
        CONTEXT7_PI_VERSION=0.1.2
        # `pi install` and settings.json's `packages` key are the same
        # mechanism — this writes the entry AND materialises the package now,
        # so nothing is fetched from the network at first launch.
        pi install "npm:@upstash/context7-pi@${CONTEXT7_PI_VERSION}"
      user: "1000"
      description: Context7 Pi extension, installed at build time
  startup:
    # The trace bind mount is established here as well as in the entrypoint.
    # Both call sites are deliberate and neither is sufficient on its own: a
    # startup step runs on every sandbox start, so it covers `sbx exec` and any
    # session that never attaches — which the entrypoint, being the agent launch
    # command, cannot reach. The entrypoint in turn covers the one start where
    # a startup step is known not to replay: after a daemon restart
    # (docker/sbx-releases #420, still open as of sbx v0.45.0).
    # mount-state.sh is idempotent — once bound it exits 0 having touched
    # nothing — so whichever of the two runs second is a no-op.
    #
    # HOME is set explicitly because a startup step runs with a minimal
    # environment; the cursor kit's own startup step documents the same trap.
    # A failure is not swallowed: this step cannot refuse to launch the agent
    # the way the entrypoint does, but it must not report success while the
    # trace path is left unbound.
    - command:
        - sh
        - -c
        - |
          set -eu
          HOME="${HOME:-/home/agent}"
          export HOME
          sh "$HOME/.local/lib/sbxagent/mount-state.sh" \
            "$HOME/.pi/agent/sessions" sessions
      user: "agent"
      description: Bind-mount ~/.pi/agent/sessions onto the state folder
